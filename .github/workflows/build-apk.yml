
name: Build FQMS Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract fixed FQMS project
        run: |
          test -f FQMS-main-fixed.zip
          mkdir -p /tmp/fqms-fixed
          unzip -q FQMS-main-fixed.zip -d /tmp/fqms-fixed
          rsync -a /tmp/fqms-fixed/FQMS-main/ ./

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create --platforms=android --project-name fqms .

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FQMS-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
